[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tree-tui"
version = "0.1.0"
description = "A decoupled, modular terminal utility for rendering tree outlines and synthesizing shell commands."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.70.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-benchmark",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
tree-tui = "tree_tui.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tree_tui"]
